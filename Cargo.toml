[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
nitro-solver = { path = "crates/solver" }
nitro-hh = { path = "crates/hh" }
nitro-simulator = { path = "crates/simulator" }
nitro-population = { path = "crates/population" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
rayon = "1.10"
rs_poker = { version = "5.1", default-features = false }
softbuffer = "0.4"
thiserror = "2"
tiny-skia = "0.12"
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The solver precomputes exact all-in equities by enumerating every board; an
# unoptimised build makes that (and therefore every test and every dev run
# that solves a spot) more than ten times slower.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.nitro-solver]
opt-level = 3
